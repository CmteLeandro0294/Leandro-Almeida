const gr=document.getElementById('rings');
const lg=document.getElementById('legend');
RINGS.forEach((r,i)=>{
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',r.path);p.setAttribute('class','ring');
 p.setAttribute('fill',r.color);p.setAttribute('stroke',r.color);
 p.id='r'+i;gr.appendChild(p);
 const row=document.createElement('div');row.className='row';
 row.innerHTML='<span class="sw" style="background:'+r.color+'"></span><span>'+r.name+
   '</span><span class="nm">'+r.nm.toLocaleString('pt-BR')+' nm</span>';
 row.onclick=()=>{p.classList.toggle('off');row.classList.toggle('off');};
 lg.appendChild(row);
});
// pan & zoom
const svg=document.getElementById('map'),vp=document.getElementById('vp');
let scale=1,tx=0,ty=0,drag=false,sx,sy;
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
svg.addEventListener('wheel',e=>{e.preventDefault();
 const r=svg.getBoundingClientRect();const mx=(e.clientX-r.left)/r.width*900;const my=(e.clientY-r.top)/r.height*1000;
 const f=e.deltaY<0?1.15:1/1.15;const ns=Math.min(8,Math.max(1,scale*f));
 tx=mx-(mx-tx)*(ns/scale);ty=my-(my-ty)*(ns/scale);scale=ns;apply();},{passive:false});
svg.addEventListener('pointerdown',e=>{drag=true;sx=e.clientX;sy=e.clientY;svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();
 tx+=(e.clientX-sx)/r.width*900;ty+=(e.clientY-sy)/r.height*1000;sx=e.clientX;sy=e.clientY;apply();});
svg.addEventListener('pointerup',()=>drag=false);
</script>
